name: Assemble Heroku video upload
on:
  push:
    paths:
      - '.github/workflows/upload-heroku-video.yml'
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'm4pbuh/Test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assemble verified MP4 and commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, base64, hashlib
          root = "https://api.github.com/repos/m4pbuh/Test"
          token = os.environ["GH_TOKEN"]
          def api(path, data=None, method=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(root + path, data=body, method=method,
                  headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json", "User-Agent": "Heroku-video-upload"})
              with urllib.request.urlopen(req, timeout=180) as r:
                  return json.load(r)
          parts = ["b764eb21e3af7e193a5637af7e3d144ba633cc82","131d8d0d046d517477f4c52b18a010fc6129248d","2363b94e73041ef187821e29e82228e9ae9f879e","65c84dbc12dc16da55274e2379ddea8d7ba5347a","309680e66dc759e53c73587ae29fecb2afd29e52","ccb5258b72d195cc2be724291c1301c47012cce8","e0163b56bc46b1d7d971aabea166b874d2161c52","2e0cfa585f459a59f195742cb52364944213d129","8b8d38fa2c9be2c3bc787f4a4619aedf111eb265","641d2156bb70bfb60ce72f085c3100cfdceb6c9c","5308c467821c39f31eda17535393f644c27c3d76","bb5e8c53e5f67b740d0524a00c00a3c66501fc70"]
          video = b"".join(base64.b64decode(api("/git/blobs/" + sha)["content"]) for sha in parts)
          expected = "736a5e12fac1b35f9059fb4c93f71131b2f4a985"
          actual = hashlib.sha1(b"blob " + str(len(video)).encode() + b"\0" + video).hexdigest()
          assert len(video) == 36900212, "Incorrect video size"
          assert actual == expected, "Video checksum mismatch"
          blob = api("/git/blobs", {"content": base64.b64encode(video).decode(), "encoding": "base64"})
          assert blob["sha"] == expected
          head = api("/git/ref/heads/main")["object"]["sha"]
          base_tree = api("/git/commits/" + head)["tree"]["sha"]
          tree = api("/git/trees", {"base_tree": base_tree, "tree": [
              {"path": "Heroku_New_Orbit_4K.mp4", "mode": "100644", "type": "blob", "sha": blob["sha"]}]})
          commit = api("/git/commits", {"message": "Upload Heroku New Orbit 4K video", "tree": tree["sha"], "parents": [head]})
          api("/git/refs/heads/main", {"sha": commit["sha"], "force": False}, "PATCH")
          print("Uploaded 36-second 4K video; verified size and SHA-1:", expected)
          PY
